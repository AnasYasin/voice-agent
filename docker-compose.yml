services:
  livekit:
    image: livekit/livekit-server:latest
    command: --dev --bind 0.0.0.0
    ports:
      - "7880:7880"                    # HTTP / WebSocket
      - "7881:7881"                    # TCP fallback for WebRTC
      - "50000-50100:50000-50100/udp"  # media
    environment:
      LIVEKIT_KEYS: "devkey: devsecret_change_me_in_production"

  # SIP bridge. Lets a softphone (Linphone/Zoiper) reach the agent
  # without any telephony carrier or hardware.
  livekit-sip:
    image: livekit/sip:latest
    depends_on: [livekit]
    ports:
      - "5060:5060/udp"
    environment:
      SIP_CONFIG_BODY: |
        api_key: devkey
        api_secret: devsecret_change_me_in_production
        ws_url: ws://livekit:7880
        sip_port: 5060

  postgres:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: agent
      POSTGRES_PASSWORD: agent
      POSTGRES_DB: voice_agent
    volumes:
      - pgdata:/var/lib/postgresql/data

  # Only needed once you add the GSM gateway. Not used for softphone testing,
  # since LiveKit SIP handles that directly.
  asterisk:
    image: andrius/asterisk:latest
    profiles: ["gateway"]
    network_mode: host
    volumes:
      - ./telephony/asterisk:/etc/asterisk:ro

volumes:
  pgdata:
