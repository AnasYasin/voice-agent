<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Voice agent</title>
<style>
  :root {
    color-scheme: light dark;
    --accent: #2563eb;
    --accent-soft: color-mix(in srgb, var(--accent) 18%, transparent);
    --line: color-mix(in srgb, currentColor 18%, transparent);
    --muted: color-mix(in srgb, currentColor 60%, transparent);
  }
  * { box-sizing: border-box; }
  body {
    font: 16px/1.55 system-ui, sans-serif;
    max-width: 30rem; margin: 0 auto; padding: 2.5rem 1.25rem 3rem;
    display: flex; flex-direction: column; align-items: center; gap: 1.1rem;
  }

  /* The orb. Breathes while idle, pulses while the agent speaks, grows a ring
     while the caller speaks. Driven only by class changes from the call. */
  #orb {
    width: 9rem; height: 9rem; border-radius: 50%; margin: .5rem 0 .25rem;
    background: radial-gradient(circle at 35% 35%, #60a5fa, var(--accent) 60%, #1e3a8a);
    box-shadow: 0 0 0 0 var(--accent-soft), 0 1rem 3rem -1rem var(--accent);
    animation: breathe 4s ease-in-out infinite;
    transition: transform .25s ease, box-shadow .25s ease;
  }
  #orb.talking { animation: pulse .9s ease-in-out infinite; }
  #orb.listening { box-shadow: 0 0 0 .6rem var(--accent-soft), 0 1rem 3rem -1rem var(--accent); }
  #orb.off { filter: grayscale(.7) brightness(.85); animation: none; }
  @keyframes breathe {
    0%, 100% { transform: scale(1); }
    50%      { transform: scale(1.04); }
  }
  @keyframes pulse {
    0%, 100% { transform: scale(1);    box-shadow: 0 0 0 0 var(--accent-soft), 0 1rem 3rem -1rem var(--accent); }
    50%      { transform: scale(1.09); box-shadow: 0 0 0 1.1rem var(--accent-soft), 0 1rem 3rem -1rem var(--accent); }
  }

  h1 { font-size: 1.2rem; margin: 0; font-weight: 650; }
  #status { margin: 0; font-size: .95rem; color: var(--muted); text-align: center; min-height: 1.5em; }

  form { width: 100%; display: flex; flex-direction: column; gap: 1rem; margin-top: .5rem; }
  label, .label { display: block; font-weight: 600; font-size: .8rem; margin-bottom: .3rem; }
  .help { font-size: .8rem; color: var(--muted); margin: .25rem 0 0; }

  #languages {
    display: flex; gap: .3rem; padding: .25rem;
    border: 1px solid var(--line); border-radius: .6rem;
  }
  #languages button {
    flex: 1; padding: .55rem .8rem; font: inherit; font-weight: 600;
    border: 0; border-radius: .4rem; cursor: pointer; background: transparent; color: inherit;
  }
  #languages button[aria-pressed="true"] { background: var(--accent); color: #fff; }

  input, textarea {
    width: 100%; padding: .7rem .8rem; font: inherit; color: inherit;
    border: 1px solid var(--line); border-radius: .5rem; background: transparent;
  }
  textarea { min-height: 6.5rem; resize: vertical; line-height: 1.45; }
  input:focus, textarea:focus { outline: 2px solid var(--accent); outline-offset: 1px; border-color: transparent; }

  .actions { display: flex; gap: .6rem; }
  .actions button {
    flex: 1; padding: .85rem 1.2rem; font: inherit; font-weight: 650;
    border: 0; border-radius: .6rem; cursor: pointer; background: var(--accent); color: #fff;
  }
  #hangup { background: transparent; color: inherit; border: 1px solid var(--line); }
  button:disabled { opacity: .45; cursor: not-allowed; }
  [hidden] { display: none !important; }

  #live { font-size: .8rem; color: var(--muted); margin: 0; }
</style>
</head>
<body>

<div id="orb" class="off" aria-hidden="true"></div>
<h1>Voice agent</h1>
<p id="status">Pick a language, say what the agent is for, and connect.</p>

<form id="setup" onsubmit="return false">
  <div>
    <span class="label" id="languages-label">Language</span>
    <div id="languages" role="group" aria-labelledby="languages-label"></div>
  </div>

  <div>
    <label for="purpose">What is this agent for?</label>
    <textarea id="purpose" maxlength="2000"
      placeholder="Write the purpose of this voice agent as a system prompt. For example: You are calling patients of City Dental to confirm tomorrow's appointment. Ask whether the time still works, and if not, note a better time."></textarea>
    <p class="help">The basic rules are added for you: that it is a calling agent, that it keeps answers short, and the time limit. Leave it empty for the default agent.</p>
  </div>

  <div>
    <label for="passcode">Access code</label>
    <input id="passcode" type="password" autocomplete="off" inputmode="text" />
  </div>

  <div class="actions">
    <button id="go" type="button">Connect and talk</button>
    <button id="hangup" type="button" hidden>Hang up</button>
  </div>
</form>

<p id="live" aria-live="polite"></p>

<script type="module">
import {
  Room, RoomEvent, createLocalAudioTrack,
} from 'https://cdn.jsdelivr.net/npm/livekit-client@2/dist/livekit-client.esm.mjs';

const orb = document.getElementById('orb');
const status = document.getElementById('status');
const button = document.getElementById('go');
const hangup = document.getElementById('hangup');
const passcode = document.getElementById('passcode');
const purpose = document.getElementById('purpose');
const toggle = document.getElementById('languages');
const say = (text) => { status.textContent = text; };

// The microphone needs a secure context. Say so plainly, because the failure
// otherwise surfaces as an undefined getUserMedia deep inside connect, and on
// a shared link the person reading it is not the person who deployed it.
if (!window.isSecureContext || !navigator.mediaDevices) {
  say('This page needs HTTPS to use the microphone.');
  button.disabled = true;
}

passcode.addEventListener('keydown', (e) => {
  if (e.key === 'Enter') button.click();
});

// The languages come from the server, one button each, so a new pack under
// lang/ shows up here without touching this page. The server also says which
// one starts selected.
let chosen = null;
let chosenName = '';
function pick(locale, name) {
  chosen = locale;
  chosenName = name;
  for (const segment of toggle.children) {
    segment.setAttribute('aria-pressed', String(segment.dataset.locale === locale));
  }
}
async function loadLanguages() {
  try {
    const r = await fetch('/api/languages', { cache: 'no-store' });
    const body = await r.json();
    toggle.replaceChildren();
    for (const { locale, name } of body.languages) {
      const segment = document.createElement('button');
      segment.type = 'button';
      segment.textContent = name;
      segment.dataset.locale = locale;
      segment.onclick = () => pick(locale, name);
      toggle.append(segment);
    }
    const first = body.languages.find((l) => l.locale === body.default) || body.languages[0];
    pick(first.locale, first.name);
  } catch {
    say('Could not reach the server.');
    button.disabled = true;
  }
}
loadLanguages();

// Live call count, polled from the same /healthz the box uses. Best effort:
// a failed poll just leaves the last line in place rather than showing an error.
const live = document.getElementById('live');
async function refreshLive() {
  try {
    const r = await fetch('/healthz', { cache: 'no-store' });
    const { in_flight, busy } = await r.json();
    const count = Number(in_flight) || 0;
    live.textContent = count === 0
      ? 'No one is on a call right now.'
      : `${count} ${count === 1 ? 'person is' : 'people are'} on a call right now${busy ? ', all lines full' : ''}.`;
  } catch { /* keep the last known line */ }
}
refreshLive();
setInterval(refreshLive, 4000);

function setForm(locked) {
  for (const field of [passcode, purpose, ...toggle.children]) field.disabled = locked;
  button.hidden = locked;
  hangup.hidden = !locked;
}

let room = null;
hangup.onclick = () => room?.disconnect();

button.onclick = async () => {
  const code = passcode.value.trim();
  if (!code) return say('Enter the access code first.');
  if (!chosen) return say('Pick a language first.');

  button.disabled = true;
  say('Connecting…');

  // The token is fetched, never pasted. The server mints one per visitor and
  // starts an agent for that room, in the chosen language and with the
  // purpose written above, before answering.
  let url, token;
  try {
    const response = await fetch('/api/session', {
      method: 'POST',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ passcode: code, language: chosen, purpose: purpose.value }),
    });
    const body = await response.json();
    if (!response.ok) {
      say(body.error || 'Could not start the call.');
      button.disabled = false;
      return;
    }
    ({ url, token } = body);
  } catch (error) {
    say('Could not reach the server.');
    button.disabled = false;
    return;
  }

  room = new Room({ adaptiveStream: false, dynacast: false });

  // The agent speaks at 8 kHz on purpose. Play it back untouched so the demo
  // sounds like the phone call it is standing in for.
  room.on(RoomEvent.TrackSubscribed, (track) => {
    if (track.kind === 'audio') {
      track.attach().play?.();
      say(`Connected. Answer in ${chosenName}.`);
    }
  });
  // The orb follows who is speaking. The agent joins as "agent"; the other
  // active speaker can only be this browser.
  room.on(RoomEvent.ActiveSpeakersChanged, (speakers) => {
    orb.classList.toggle('talking', speakers.some((p) => p.identity === 'agent'));
    orb.classList.toggle('listening', speakers.some((p) => p.isLocal));
  });
  room.on(RoomEvent.Disconnected, () => {
    say('Call ended.');
    orb.className = 'off';
    setForm(false);
    button.disabled = false;
    room = null;
  });

  try {
    await room.connect(url, token);

    // Browser mics default to 48 kHz with noise suppression and AGC. Those
    // clean up the audio in ways a real phone line never would, so leave the
    // signal alone and let the agent band-limit it.
    const mic = await createLocalAudioTrack({
      echoCancellation: true,
      noiseSuppression: false,
      autoGainControl: false,
    });
    await room.localParticipant.publishTrack(mic);
    orb.className = '';
    setForm(true);
    say(`Connected. Wait for the agent to speak, then reply in ${chosenName}.`);
  } catch (error) {
    say('Failed: ' + error.message);
    button.disabled = false;
  }
};
</script>
</body>
</html>
