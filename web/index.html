<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Urdu voice agent</title>
<style>
  :root { color-scheme: light dark; }
  body {
    font: 16px/1.6 system-ui, sans-serif;
    max-width: 32rem; margin: 3rem auto; padding: 0 1.25rem;
  }
  h1 { font-size: 1.35rem; margin-bottom: .25rem; }
  p.sub { margin-top: 0; opacity: .7; font-size: .9rem; }
  label { display: block; margin: 1.75rem 0 .35rem; font-weight: 600; font-size: .85rem; }
  input {
    width: 100%; padding: .7rem .8rem; font: inherit;
    border: 1px solid color-mix(in srgb, currentColor 25%, transparent);
    border-radius: .4rem; background: transparent; color: inherit;
  }
  button {
    margin-top: 1.25rem; padding: .8rem 1.4rem; font: inherit; font-weight: 600;
    width: 100%; border: 0; border-radius: .4rem; cursor: pointer;
    background: #2563eb; color: #fff;
  }
  button:disabled { opacity: .45; cursor: not-allowed; }
  #status {
    margin-top: 1.5rem; padding: .8rem 1rem; border-radius: .4rem; font-size: .9rem;
    background: color-mix(in srgb, currentColor 8%, transparent);
  }
</style>
</head>
<body>

<h1>Urdu voice agent</h1>
<p class="sub">Enter the code, allow the microphone, and talk to it in Urdu.</p>

<label for="passcode">Access code</label>
<input id="passcode" type="password" autocomplete="off" inputmode="text" />

<button id="go">Connect and talk</button>

<div id="status">Ready.</div>

<p id="live" class="sub" aria-live="polite"></p>

<script type="module">
import {
  Room, RoomEvent, createLocalAudioTrack,
} from 'https://cdn.jsdelivr.net/npm/livekit-client@2/dist/livekit-client.esm.mjs';

const status = document.getElementById('status');
const button = document.getElementById('go');
const passcode = document.getElementById('passcode');
const say = (text) => { status.textContent = text; };

// The microphone needs a secure context. Say so plainly, because the failure
// otherwise surfaces as an undefined getUserMedia deep inside connect, and on
// a shared link the person reading it is not the person who deployed it.
if (!window.isSecureContext || !navigator.mediaDevices) {
  say('This page needs HTTPS to use the microphone.');
  button.disabled = true;
}

passcode.addEventListener('keydown', (e) => {
  if (e.key === 'Enter') button.click();
});

// Live call count, polled from the same /healthz the box uses. Best effort:
// a failed poll just leaves the last line in place rather than showing an error.
const live = document.getElementById('live');
async function refreshLive() {
  try {
    const r = await fetch('/healthz', { cache: 'no-store' });
    const { in_flight, busy } = await r.json();
    const n = Number(in_flight) || 0;
    live.textContent = n === 0
      ? 'No one is on a call right now.'
      : `${n} ${n === 1 ? 'person is' : 'people are'} on a call right now${busy ? ' — all lines full' : ''}.`;
  } catch { /* keep the last known line */ }
}
refreshLive();
setInterval(refreshLive, 4000);

button.onclick = async () => {
  const code = passcode.value.trim();
  if (!code) return say('Enter the access code first.');

  button.disabled = true;
  say('Connecting…');

  // The token is fetched, never pasted. The server mints one per visitor and
  // starts an agent for that room before answering, so the caller is not
  // sitting in an empty room waiting for a process to be asked to exist.
  let url, token;
  try {
    const response = await fetch('/api/session', {
      method: 'POST',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ passcode: code }),
    });
    const body = await response.json();
    if (!response.ok) {
      say(body.error || 'Could not start the call.');
      button.disabled = false;
      return;
    }
    ({ url, token } = body);
  } catch (error) {
    say('Could not reach the server.');
    button.disabled = false;
    return;
  }

  const room = new Room({ adaptiveStream: false, dynacast: false });

  // The agent speaks at 8 kHz on purpose. Play it back untouched so the demo
  // sounds like the phone call it is standing in for.
  room.on(RoomEvent.TrackSubscribed, (track) => {
    if (track.kind === 'audio') {
      track.attach().play?.();
      say('Connected. The agent is speaking, answer in Urdu.');
    }
  });
  room.on(RoomEvent.Disconnected, () => {
    say('Call ended.');
    button.disabled = false;
  });

  try {
    await room.connect(url, token);

    // Browser mics default to 48 kHz with noise suppression and AGC. Those
    // clean up the audio in ways a real phone line never would, so leave the
    // signal alone and let the agent band-limit it.
    //
    const mic = await createLocalAudioTrack({
      echoCancellation: true,
      noiseSuppression: false,
      autoGainControl: false,
    });
    await room.localParticipant.publishTrack(mic);
    say('Connected. Wait for the agent to speak, then reply in Urdu.');
  } catch (error) {
    say('Failed: ' + error.message);
    button.disabled = false;
  }
};
</script>
</body>
</html>
