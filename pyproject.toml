[project]
name = "voice-agent"
version = "0.1.0"
description = "Urdu outbound voice agent for appointment confirmation"
requires-python = ">=3.11"

# Base deps only. Phase 0 needs almost nothing, so you can start
# evaluating Urdu accuracy before installing the whole agent stack.
dependencies = [
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
# Phase 0: measure Urdu STT accuracy on real phone audio.
# This is all you need to run `make eval`.
eval = [
    "elevenlabs>=1.0",
    "deepgram-sdk>=3.0",
    "anthropic>=0.40",
    "jiwer>=3.0",          # word error rate
    "rich>=13.0",          # readable eval report
]

# The live agent. Install once Phase 0 passes.
agent = [
    "livekit-agents>=0.11",
    "livekit-plugins-elevenlabs",
    "livekit-plugins-deepgram",
    "livekit-plugins-azure",
    "livekit-plugins-anthropic",
    "livekit-plugins-silero",     # voice activity detection
    "azure-cognitiveservices-speech>=1.40",
    "anthropic>=0.40",
]

store = [
    "sqlalchemy>=2.0",
    "asyncpg>=0.29",
    "boto3>=1.34",
]

dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "ruff>=0.16,<0.17"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/voice_agent"]

[tool.ruff]
line-length = 100
target-version = "py311"

# Pinned explicitly. Ruff's default rule set changes between versions, and
# tests/test_lint.py runs these, so an unpinned list would mean a ruff upgrade
# could fail the suite without a line of code changing.
[tool.ruff.lint]
select = [
    "E",    # pycodestyle
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # import sorting
    "B",    # bugbear
    "UP",   # pyupgrade
    "RUF",  # ruff's own
]
ignore = [
    "E501",  # line length is the formatter's job, not a lint error

    # Ambiguous-unicode rules. This project is written in Urdu, so they fire on
    # ۔ ، ۵ ٧ and every other correct character, suggesting Latin lookalikes.
    # Leaving them on would train us to ignore lint output.
    "RUF001",
    "RUF002",
    "RUF003",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = ["live: hits a real API, needs keys in .env"]
