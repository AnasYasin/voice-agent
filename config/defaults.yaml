# Tunable parameters. Every number here changes behaviour or quality, so each
# one is a knob you may want to turn during Phase 0 rather than a constant.
#
# What does NOT belong here:
#   - Secrets and per-machine values. Those live in .env.
#   - Language data (voice name, keyterms, the call script). Those live under
#     lang/<code>/, because adding a language must stay a folder rather than an
#     edit to this file.
#
# Override any of it with a second YAML:  VOICE_AGENT_CONFIG=/path/to/my.yaml

audio:
  # A real Pakistani phone line. Changing these changes what every accuracy
  # number in the project means, so change them deliberately and re-run the
  # gate afterwards.
  sample_rate: 8000
  band_low_hz: 300
  band_high_hz: 3400

  # pcm_s16le is 16-bit PCM, which every speech API accepts.
  # pcm_mulaw is closer to what a GSM gateway actually delivers.
  codec: pcm_s16le

  # How much silence ends a caller's turn. Every millisecond here is dead
  # air the caller sits through before the agent starts thinking. Too low
  # and it cuts people off mid-sentence.
  #
  # Streaming STT transcribes while they are still talking, so this is now
  # the only part of the wait that is still real.
  #
  # Was 0.25 from 26 Aug to 18 Sep 2026. Six real calls that day, in both
  # languages, show turns ending mid-phrase at natural pauses: "and we bought
  # some cheese and", "وہاں پہ". The agent then answers a fragment and talks
  # over the rest. Half a second costs a quarter second per turn and stops it.
  vad_silence_seconds: 0.5

  # One frame of audio, in and out. 20 ms is what LiveKit and every telephony
  # stack expect, and it is also how soon a streamed reply can start playing.
  frame_ms: 20

stt:
  # Scribe v1 is the file-based model, which is what Phase 0 scores.
  # v2 realtime is the streaming one, used on live calls: partial transcripts
  # arrive while the caller is still speaking, so the wait at the end of their
  # turn is a commit rather than an upload.
  elevenlabs_model: scribe_v1
  elevenlabs_realtime_model: scribe_v2_realtime
  deepgram_model: nova-3

tts:
  # Synthesis stays wideband. audio.to_telephone is the single place that makes
  # something sound like a phone, so one cached WAV serves a browser demo and a
  # real 8 kHz call. Only 8000, 16000 and 24000 are mapped to Azure formats.
  sample_rate: 24000

  # How much synthesised audio to keep buffered ahead of playback. This is what
  # stops the caller hearing a pause between every sentence: the next one is
  # sent to Azure while the current one is still being spoken, so the round trip
  # happens behind audio rather than in front of it.
  #
  # It has to cover a synthesis *and* the model writing the next sentence, which
  # is the slower half. At 1.5 a long reply still ran dry once. The cost of
  # going higher is only the audio thrown away when a caller interrupts, and
  # that audio is cheap.
  lookahead_seconds: 3.0

  # The ElevenLabs voice model, for languages Azure has no voice for. Sindhi is
  # the first. eleven_v3 lists Sindhi and Urdu among 70+ languages; the older
  # multilingual and flash models do not. Roughly eleven times Azure's price
  # per character, which the cache absorbs on scripted lines and talk mode pays
  # on every sentence. See voice_agent_costs.md.
  elevenlabs_model: eleven_v3

evaluation:
  # A line worse than this is flagged in the roundtrip report. It is a reading
  # aid, not the go/no-go number. The gate is slot accuracy on real recordings.
  wer_threshold: 0.20

llm:
  # Slot extraction only, never prose. Sonnet handles Urdu code-switching
  # ("جی haan, 3 baje") better than Haiku; swap to claude-haiku-4-5 for lower
  # latency once real replies show the accuracy holds.
  model: claude-sonnet-5

  # Chat replies are prose, not a booking decision, so a wrong word costs
  # a slightly odd sentence and nothing more. This call sits between the caller
  # finishing and the agent speaking, and they hear every millisecond of it, so
  # the model here is a trade between wit and waiting.
  #
  # Measured from Pakistan, 26 Aug 2026, median of 3, to a first Urdu sentence:
  #
  #   claude-haiku-4-5    1313 ms    (766 ms of that is one round trip)
  #   claude-sonnet-4-6   2452 ms
  #   claude-sonnet-5     2760 ms
  #   claude-fable-5      4314 ms    not a light model, despite the name
  #
  # An earlier note here put Sonnet ~300 ms behind Haiku. It is closer to
  # 1400 ms, and that wrong number sent one latency hunt down the wrong path.
  # Most of the gap is time to first token, not thinking: a max_tokens=1 call
  # is 766 ms on Haiku and 1638 ms on Sonnet 5.
  #
  # Switched from claude-haiku-4-5 to Sonnet 5 on 19 Sep 2026. Anas wanted the
  # agent to sound smarter, and the purpose box now carries a real brief that
  # a stronger model follows better. The cost is the gap above, roughly 1.4 s
  # added to every turn, and double the price per token. Go back to
  # claude-haiku-4-5 if callers start complaining about the wait.
  chat_model: claude-sonnet-5

  # Whether the chat model thinks before speaking, and how hard.
  #
  # Measured from Pakistan on 19 Sep 2026, median of three live turns:
  #
  #   sonnet 5, thinking high (the default)   3960 ms
  #   sonnet 5, thinking low                  2960 ms
  #   sonnet 5, thinking off                  2970 ms
  #   haiku 4.5                              ~2000 ms
  #
  # Low effort and no thinking measure the same, so thinking stays on at low
  # effort: it is the documented lever and it avoids the failure modes that
  # come with switching thinking off. The second left over against Haiku is
  # Sonnet's time to first token, not deliberation, and no setting removes it.
  # Raise the effort if replies ever sound thin.
  chat_thinking: true
  chat_effort: low
  # A ceiling, not a length control. Urdu costs several tokens per word and the
  # reply is wrapped in JSON, so a tight limit truncates mid-string and the
  # parse fails. Keep it generous and let the prompt ask for brevity.
  chat_max_tokens: 200

  # How many past exchanges talk mode replays to the model. Enough to hold a
  # whole demo call, capped so a long one does not slowly turn into a long
  # prompt, which is latency the caller sits through on every turn.
  memory_turns: 20

  # Answers are a boolean or a short time string, so the ceiling is tiny.
  # Anything longer means the model is explaining itself, which it should not.
  max_tokens: 256
